<main class="contact section-pad" id="contact"><div class="contact-heading"><p class="section-label">Let's talk</p><h2>Your next chapter<br>starts <em>here.</em></h2><p>Tell us a little about your project. We’ll be in touch within two business days to set up a friendly, no-obligation consultation.</p><div class="contact-details"><a href="mailto:baronwallsystem&#64;gmail.com">baronwallsystem&#64;gmail.com</a><a href="tel:+14169910991">(416) 991-0991</a></div></div><form class="contact-form" (ngSubmit)="submitForm()" #contactForm="ngForm"><div class="field-row"><label>First name<input type="text" name="firstName" placeholder="Jane" required ngModel></label><label>Last name<input type="text" name="lastName" placeholder="Smith" required ngModel></label></div><label>Email address<input type="email" name="email" placeholder="jane&#64;example.com" required email ngModel></label><label>Tell us about your project<textarea name="message" rows="4" placeholder="A little about your space, timeline, and goals..." required ngModel></textarea></label><button class="button button-dark" type="submit" [disabled]="contactForm.invalid">{{ formSent ? 'Message sent — thank you!' : 'Send inquiry' }}</button><p class="form-success" [class.visible]="formSent">Thanks! We’ll be in touch soon.</p></form></main>

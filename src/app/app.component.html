<div class="site-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" (click)="menuOpen = false" aria-label="Baron Renovation home">
      <span class="brand-mark">B<span>R</span></span>
      <span class="brand-name">Baron <b>Renovation</b></span>
    </a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/work" routerLinkActive="active">Our work</a>
      <a routerLink="/story" routerLinkActive="active">Our story</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>
    <button class="nav-cta" (click)="goToEstimate()">Get a free estimate</button>
    <button class="menu-toggle" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">{{ menuOpen ? '×' : '☰' }}</button>
  </header>

  @if (menuOpen) {
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a routerLink="/services" (click)="menuOpen = false">Services</a>
      <a routerLink="/work" (click)="menuOpen = false">Our work</a>
      <a routerLink="/story" (click)="menuOpen = false">Our story</a>
      <a routerLink="/contact" (click)="menuOpen = false">Contact</a>
      <button (click)="goToEstimate()">Get a free estimate</button>
    </nav>
  }

  <router-outlet></router-outlet>
</div>
